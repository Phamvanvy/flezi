<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flezi Account</title>
  <link rel="stylesheet" href="/base.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="auth-wrap">
    <section class="card auth-card">
      <h1 id="title">Create your account</h1>
      <p class="muted" id="subtitle">Register to access your personalised dashboard.</p>

      <form id="auth-form" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="254" placeholder="you@example.com">
        <p class="field-error" id="email-error" aria-live="polite"></p>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" maxlength="128">
        <ul class="rules" id="pw-rules">
          <li data-rule="length">At least 8 characters</li>
          <li data-rule="letter">At least one letter</li>
          <li data-rule="digit">At least one number</li>
        </ul>
        <p class="field-error" id="password-error" aria-live="polite"></p>

        <div class="notice" id="notice" hidden></div>
        <div class="form-error" id="form-error" role="alert" hidden></div>

        <button id="submit" type="submit"><span class="spinner" id="spinner" hidden></span><span id="submit-label">Create account</span></button>
      </form>

      <p class="toggle"><span id="toggle-text">Already have an account?</span> <a href="#" id="toggle">Sign in</a></p>
    </section>
  </main>
  <script src="/auth.js"></script>
</body>
</html>
